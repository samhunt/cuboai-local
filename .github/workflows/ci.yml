name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build debug APK
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Accept Android SDK licenses
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sm="$(ls -1 "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          yes | "$sm" --licenses >/dev/null || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cuboai-local-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build signed release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Accept Android SDK licenses
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sm="$(ls -1 "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          yes | "$sm" --licenses >/dev/null || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          raw = os.environ.get("SIGNING_KEYSTORE_BASE64", "")
          cleaned = re.sub(r"[^A-Za-z0-9+/=_-]", "", raw).replace("-", "+").replace("_", "/")
          if not cleaned:
              sys.exit("SIGNING_KEYSTORE_BASE64 is empty after cleanup.")
          cleaned += "=" * ((4 - len(cleaned) % 4) % 4)
          try:
              data = base64.b64decode(cleaned, validate=False)
          except Exception as exc:
              sys.exit(f"SIGNING_KEYSTORE_BASE64 is not valid base64: {exc}")
          if not (data.startswith(b"\x30") or data[:4] == b"\xfe\xed\xfe\xed"):
              sys.exit(
                  "SIGNING_KEYSTORE_BASE64 decoded, but it is not a Java/PKCS12 keystore. "
                  "Paste only the one-line base64 of cuboai-local.jks — no [Storing ...] text."
              )
          Path("release.jks").write_bytes(data)
          print(f"keystore bytes={len(data)}")
          PY

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
          rm -f release.jks

      - name: Name APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          dest="$RUNNER_TEMP/cuboai-local-release.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cuboai-local-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
