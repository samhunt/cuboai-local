name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # GitHub-hosted runners already ship the Android SDK. Do not install the
      # retired `tools` package that android-actions/setup-android requests by default.
      - name: Accept Android SDK licenses
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sm="$(ls -1 "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          yes | "$sm" --licenses >/dev/null || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cuboai-local-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
